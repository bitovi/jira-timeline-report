# Production-style compose — builds the image and runs the Express auth server.
# For local development with live-reload, use docker-compose.dev.yaml
# (`npm run docker:dev`) instead.
#
# No volumes are mounted here on purpose: the image already contains the server
# code and its production dependencies. A bind mount (`.:/app`) plus an anonymous
# `node_modules` volume would force Docker to copy the entire dependency tree onto
# the host at container-create time, which exhausts the deploy VM's disk.
services:
  app:
    container_name: jira-qa-metrics
    env_file: .env
    restart: always
    build: .
    ports:
      - $PORT:$PORT
    stdin_open: true
    tty: true
