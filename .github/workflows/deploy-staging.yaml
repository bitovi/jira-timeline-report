name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Build-Status-Reports:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate .env and repo_env
        run: |
          chmod +x scripts/generate-build-env.sh
          ./scripts/generate-build-env.sh
        env:
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_JIRA_INTEGRATIONS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_JIRA_INTEGRATIONS }}
          BACKEND_SENTRY_DSN: ${{ vars.BACKEND_SENTRY_DSN }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_AUTH_SERVER_URL: ${{ vars.VITE_AUTH_SERVER_URL }}
          VITE_JIRA_CLIENT_ID: ${{ vars.VITE_JIRA_CLIENT_ID }}
          VITE_JIRA_SCOPE: ${{ vars.VITE_JIRA_SCOPE }}
          VITE_JIRA_CALLBACK_URL: ${{ vars.VITE_JIRA_CALLBACK_URL }}
          VITE_JIRA_API_URL: ${{ vars.VITE_JIRA_API_URL }}
          VITE_FRONTEND_SENTRY_DSN: ${{ vars.VITE_FRONTEND_SENTRY_DSN }}
          VITE_STATUS_REPORTS_ENV: staging
          VITE_JIRA_APP_KEY: bitovi.status-report.staging

      - name: Build
        run: |
          npm ci
          npm run create:atlassian-connect -- --environment=staging
          npm run build

      - name: Build to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          include-hidden-files: true
          path: ./dist

  Deploy-Auth-Server:
    needs: Build-Status-Reports
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.vm_url}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - id: deploy
        name: Deploy
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1
        with:
          checkout: false
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_JIRA_INTEGRATIONS}}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_JIRA_INTEGRATIONS}}
          aws_default_region: us-east-1

          tf_state_bucket_destroy: true

          aws_r53_enable: true
          aws_r53_create_sub_cert: true
          aws_r53_sub_domain_name: api-status-reports-staging
          aws_r53_domain_name: bitovi.tools
          aws_elb_app_port: 3000

          docker_full_cleanup: true
          # docker_full_cleanup wipes the layer cache, so every deploy rebuilds
          # the image from scratch on a 2-vCPU t3.small. 600s used to be cutting
          # it close enough to fail.
          ansible_start_docker_timeout: 1800

          aws_ec2_instance_type: t3.small
          aws_ec2_instance_root_vol_size: 16

          repo_env: repo_env
          env_ghs: ${{ secrets.DOT_ENV_STAGING }}

  Deploy-Static-Assets:
    needs: Build-Status-Reports
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.vm_url}}
    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist

      - id: deploy
        name: Deploy static assets to S3
        uses: bitovi/github-actions-deploy-static-site-to-aws@v0.2.6
        with:
          checkout: false
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID_JIRA_INTEGRATIONS}}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY_JIRA_INTEGRATIONS}}
          aws_default_region: us-east-1
          aws_site_source_folder: ./dist

          aws_r53_sub_domain_name: status-reports-staging
          aws_r53_domain_name: bitovi.tools
          aws_site_cdn_aliases: status-reports-staging.bitovi.tools,statusreports-staging.bitovi.com
          aws_r53_cert_arn: ${{ vars.AWS_CERT_ARN }}

          tf_action: 'apply'
          tf_state_bucket_destroy: true
          aws_site_cdn_enabled: true

  # The Forge app on bitovi-training.atlassian.net. Independent of the jobs above: it builds its own
  # bundle (`dist-forge/`, not the shared `build` artifact) and reads no `.env` — the Forge build
  # hardcodes its Connect key and Sentry DSN (src/forge.main.ts). See spec/021-forge/next-steps/ci-cd.md.
  Deploy-Forge:
    runs-on: ubuntu-latest
    environment:
      name: staging
    # Not the workflow's cancel-in-progress group: a second push must never kill a deploy halfway.
    concurrency:
      group: forge-staging
      cancel-in-progress: false
    env:
      FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build
        run: |
          npm ci
          npm run build:forge

      # Global, never a devDependency. The CLI still pulls in `keytar` (a native module); libsecret
      # lets its compile fallback succeed when the prebuilt download times out. Keep the major in
      # step with the one developers install locally.
      - name: Install Forge CLI
        run: |
          sudo apt-get install -y libsecret-1-dev
          npm install --global @forge/cli@14
          forge settings set usage-analytics false

      # `-e staging` always — no `-e` means production. `--approve` is staging-only: a major version
      # here should reach bitovi-training, not stall every merge to main. Never add it to production.
      - name: Deploy
        run: forge deploy -e staging --non-interactive --approve MAJOR_VERSION_RULE

      # Minor versions apply on their own; this is what carries a major version onto the site.
      - name: Upgrade installation
        run: forge install --upgrade -e staging --site bitovi-training.atlassian.net --product jira --non-interactive

  Sentry-Release-Backend:
    needs: Deploy-Auth-Server
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_BACKEND_PROJECT }}
        with:
          environment: staging
          version: ${{ github.sha }}

  Sentry-Release-Frontend:
    needs: Deploy-Static-Assets
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
        with:
          environment: staging
          version: ${{ github.sha }}
